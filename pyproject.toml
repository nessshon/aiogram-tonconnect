[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "aiogram-tonconnect"
description = "TON Connect for aiogram — connect wallets, send transactions and sign data from Telegram bots."
# Python 3.15 waits for aiogram: 3.31.0 declares <3.15
requires-python = ">=3.10"
authors = [
    { name = "nessshon" },
]
maintainers = [
    { name = "nessshon" },
]
dependencies = [
    "aiogram>=3.25.0,<4.0",
    "pydantic>=2.6,<3.0",
    "ton-connect>=1.2.0,<2.0",
]
keywords = [
    "AsyncIO",
    "TON",
    "TON Connect",
    "TON blockchain",
    "Telegram",
    "aiogram",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dynamic = ["version"]
readme = "README.md"
license = "MIT"

[project.urls]
Homepage = "https://github.com/nessshon/aiogram-tonconnect/"
Example = "https://github.com/nessshon/aiogram-tonconnect/tree/main/example/"

[tool.setuptools.packages.find]
include = ["aiogram_tonconnect", "aiogram_tonconnect.*"]

[tool.setuptools.package-data]
aiogram_tonconnect = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "aiogram_tonconnect.__meta__.__version__" }

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    # pydocstyle
    "D",
    # pycodestyle
    "E",
    "W",
    # pyflakes
    "F",
    # isort
    "I",
    # flake8-bugbear
    "B",
    # flake8-comprehensions
    "C4",
    # pyupgrade
    "UP",
    # flake8-simplify
    "SIM",
    # type-checking imports
    "TCH",
    # perflint
    "PERF",
    # flake8-debugger
    "T10",
    # flake8-print
    "T20",
    # flake8-pie
    "PIE",
    # pylint errors
    "PLE",
    # flake8-return
    "RET",
    # ruff-specific
    "RUF",
]
ignore = [
    # line too long
    "E501",
    # docstring in public module
    "D100",
    # docstring in public class, method and function: only where the name and signature do not say it all
    "D101",
    "D102",
    "D103",
    # docstring in public package
    "D104",
    # docstring in magic method
    "D105",
    # docstring in __init__
    "D107",
    # blank line before class docstring (conflicts D211)
    "D203",
    # multi-line summary second line (conflicts D212)
    "D213",
    # first word capitalization (false positive for proper nouns like dApp)
    "D403",
    # type-checking import (false positive for Pydantic models)
    "TC001",
    "TC002",
]
# Arrows of the screen buttons
allowed-confusables = ["‹", "›"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"example/*" = ["D"]
"tests/*" = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["aiogram_tonconnect"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.10"
strict = true
pretty = true
show_error_codes = true
show_error_context = true
namespace_packages = true
follow_imports_for_stubs = true
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "redundant-cast",
    "truthy-bool",
]
